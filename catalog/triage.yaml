# Draft entry for NousResearch/hermes-agent: plugin-catalog/triage.yaml
# Before the PR: push the commit, put its full 40-character hash in `sha` and
# in the image URL, run `hermes plugins validate` on it, then copy this file
# (without these comment lines) into plugin-catalog/ in a fork of hermes-agent.
name: triage
title: Triage
repo: https://github.com/<owner>/triage
sha: 0000000000000000000000000000000000000000
description: "Keeps thousands of skills out of the context window: skills are indexed (not copied) from the folders you choose into a local SQLite search store, ranked against your draft as composer chips, and loaded only when you pick one or the model calls skill_search / skill_load. Desktop adds the suggestion row, a held-skills pile and a loaded-skills fan above the prompt. Disclosure: rewrites outgoing model requests (removes Hermes' skills index from the system prompt, adds the bodies of the skills you picked); adds the Hermes skills it serves to skills.disabled in your Hermes config so Hermes stops listing them twice (setting 'Hide Hermes' own skills', undone with `hermes triage restore`, run it before uninstalling); reads the skill folders you configure and watches them from a background thread; the optional `embedder` setting imports a Python class you name; keeps its store and logs in its plugin-data folder; makes no network calls of its own and sends no telemetry."
maintainer: <owner>
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.1.2"
readme: true
capabilities:
  provides_tools: [skill_search, skill_load]
  provides_hooks: [pre_llm_call, pre_tool_call, transform_tool_result, post_compaction]
  provides_middleware: [llm_request, tool_execution]
  requires_env: []
